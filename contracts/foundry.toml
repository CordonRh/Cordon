[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
ffi = true
fs_permissions = [{ access = "read-write", path = "../circuits" }, { access = "read", path = "./out" }, { access = "read-write", path = "../packages/shared/deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "poseidon2-evm/=lib/poseidon2-evm/src/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 500
fail_on_revert = false

[fmt]
ignore = ["src/verifiers/**"]
