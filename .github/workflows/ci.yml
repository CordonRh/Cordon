# Builds and tests everything that holds or moves funds, on every push and pull request:
# the app/SDK/server (typecheck + unit tests with real proofs), the circuits (nargo tests,
# and a check that the committed verifiers and browser circuits are exactly what the
# pinned toolchain produces), the contracts (full Foundry suite with real proofs and
# invariants), static analysis (Slither, Semgrep) and a secret scan of the whole history.
# Every action is pinned to a commit; tools are pinned to versions.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NARGO_VERSION: 1.0.0-beta.22
  BB_VERSION: 5.0.0-nightly.20260522
  FOUNDRY_VERSION: v1.8.3

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.5.4
      - name: Edge functions typecheck against the frozen deno.lock
        working-directory: supabase/functions
        run: deno check --frozen */index.ts
      - name: Edge function unit tests with coverage
        working-directory: supabase/functions
        run: |
          deno test --frozen --allow-env --coverage=cov
          deno coverage --exclude='(_test|fakes)\.ts$' cov

  circuits-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install nargo and bb (release tarballs, checksum-verified)
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL -o nargo.tgz "https://github.com/noir-lang/noir/releases/download/v${NARGO_VERSION}/nargo-x86_64-unknown-linux-gnu.tar.gz"
          echo "384c4fc800905b213e26aabd738a96a4a85b1a76ffc27fb19aeb6d33494a787b  nargo.tgz" | sha256sum -c -
          curl -sSfL -o bb.tgz "https://github.com/AztecProtocol/barretenberg/releases/download/v${BB_VERSION}/barretenberg-amd64-linux.tar.gz"
          echo "d207ec90fbfa2fba24d7a47b7a75892ee052b7984252b866a4a0c1b5296e1571  bb.tgz" | sha256sum -c -
          tar xzf nargo.tgz -C "$HOME/bin" nargo
          tar xzf bb.tgz -C "$HOME/bin" bb
          rm nargo.tgz bb.tgz
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Circuit static check (any compiler warning fails)
        working-directory: circuits
        run: |
          out=$(nargo check --workspace 2>&1) || { echo "$out"; exit 1; }
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: Circuit tests
        working-directory: circuits
        run: nargo test --workspace
      - name: Rebuild circuits; committed verifiers must match
        run: |
          bash circuits/build.sh
          git diff --exit-code -- contracts/src/verifiers public/circuits
      - name: Contract dependencies
        run: bash contracts/install.sh
      - name: Contract tests (real proofs, fuzz, invariants)
        working-directory: contracts
        run: forge test

  fork:
    # Real dependencies on Robinhood Chain mainnet (TSLA Stock Token, Chainlink TSLA/USD).
    # Note: public RPC is not archive, so this runs at the latest block; set the
    # ROBINHOOD_ARCHIVE_RPC secret and FORK_BLOCK variable to pin it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - run: bash contracts/install.sh
      - name: Fork tests
        working-directory: contracts
        env:
          FORK_RPC: ${{ secrets.ROBINHOOD_ARCHIVE_RPC || 'https://rpc.mainnet.chain.robinhood.com/rpc' }}
          FORK_BLOCK: ${{ vars.FORK_BLOCK }}
        run: >
          forge test --match-path test/Fork.t.sol -vvv
          --fork-url "$FORK_RPC" ${FORK_BLOCK:+--fork-block-number $FORK_BLOCK}
          --fork-retries 10 --fork-retry-backoff 1000

  halmos:
    # Symbolic checks on the oracle scaling, fee split and index math (test/Halmos.t.sol).
    # Note: gates all 12 checks (each solves in < 10 s on cvc5); a new check that times out
    # needs its own filter.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install halmos==0.3.3
      - run: bash contracts/install.sh
      - name: Halmos
        working-directory: contracts
        env:
          HALMOS_ALLOW_DOWNLOAD: "1" # halmos fetches its pinned, checksum-verified cvc5
          FOUNDRY_DYNAMIC_TEST_LINKING: "false"
          FOUNDRY_LINT_LINT_ON_BUILD: "false"
        run: >
          halmos --match-contract HalmosTest
          --function '^check_'
          --solver cvc5-int --solver-threads 2 --solver-timeout-assertion 120s

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install slither-analyzer==0.11.6 semgrep==1.179.0
      - name: Slither (hand-written contracts; generated verifiers excluded)
        working-directory: contracts
        run: |
          bash install.sh
          rm -rf src/verifiers test script
          slither . --config-file slither.config.json --fail-high
      - name: Semgrep (TypeScript server, SDK, workers)
        run: >
          semgrep scan --error --metrics=off
          --config p/typescript --config p/secrets
          src/server src/lib packages services supabase/functions

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (whole history)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks git --redact -v .
